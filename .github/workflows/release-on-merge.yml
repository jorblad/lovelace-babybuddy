
name: Label-driven Release on merged PR

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'patch')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type
        id: determine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ inputs.bump }}"
          else
            LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
            echo "labels='$LABELS'"
            BUMP=''
            if echo "$LABELS" | grep -E -w "release:major|major" >/dev/null; then BUMP=major
            elif echo "$LABELS" | grep -E -w "release:minor|minor" >/dev/null; then BUMP=minor
            elif echo "$LABELS" | grep -E -w "release:patch|patch" >/dev/null; then BUMP=patch
            fi
          fi
          echo "BUMP=$BUMP" >> $GITHUB_ENV
          echo "bump=$BUMP"

      - name: Stop if no release label
        if: env.BUMP == ''
        run: |
          echo "No release label found on PR; skipping release."
          exit 0

      - name: Create tag and release notes
        env:
          BUMP: ${{ env.BUMP }}
        run: |
          git fetch --tags origin
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          VER=${LATEST_TAG#v}
          IFS=. read -r MAJOR MINOR PATCH <<<"$VER"
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0;;
            minor)
              MINOR=$((MINOR+1)); PATCH=0;;
            patch)
              PATCH=$((PATCH+1));;
          esac
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "New tag will be: $NEW_TAG"
          # Ensure there are commits since latest tag
          if [ "$LATEST_TAG" != "v0.0.0" ]; then
            if [ -z "$(git log --oneline ${LATEST_TAG}..HEAD)" ]; then
              echo "No commits since ${LATEST_TAG}; aborting." >&2
              exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

          # Create release notes
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            NOTES="$(git log --oneline -n 50 --pretty=format:'- %s (%h)')"
          else
            NOTES="$(git log --pretty=format:'- %s (%h)' ${LATEST_TAG}..HEAD)"
          fi
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: ${{ env.NEW_TAG }}
          body: ${{ env.RELEASE_BODY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

