name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check card files
        run: |
          shopt -s nullglob
          for f in dist/*.js; do
            node --check "$f"
          done

      - name: Run card tests
        run: npm test
